# OpenTelemetry Collector configuration -- SPLUNK DISTRIBUTION
#
# Variant of otel-collector-config.yaml for the Splunk Distribution of
# the OTel Collector (quay.io/signalfx/splunk-otel-collector). Use this
# when OTEL_COLLECTOR_IMAGE is set to the Splunk Distribution image.
#
# Differences from the upstream contrib config:
#   - gen_ai_normalizer processor removed (not bundled in Splunk distro)
#   - All other components are identical
#
# To use:
#   1. Set OTEL_COLLECTOR_IMAGE=quay.io/signalfx/splunk-otel-collector:latest
#   2. Set OTEL_COLLECTOR_CONFIG=./otel-collector-config.splunk-distro.yaml
#   3. docker compose up -d --force-recreate otel-collector
#
# Sibling files (select one via OTEL_COLLECTOR_CONFIG in .env):
#   otel-collector-config.yaml               Splunk only, upstream contrib (default)
#   otel-collector-config.splunk-distro.yaml  Splunk only, Splunk Distribution (this file)
#   otel-collector-config.azure.yaml         Azure Monitor only
#   otel-collector-config.dual.yaml          both backends in parallel

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    container_labels_to_metric_labels:
      com.docker.compose.service: compose.service
      com.docker.compose.project: compose.project

  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu: {}
      memory: {}
      filesystem: {}
      network: {}

processors:
  batch:
    send_batch_size: 512
    timeout: 5s

  # gen_ai_normalizer is NOT available in the Splunk Distribution.
  # It is only needed for OpenLLMetry (Traceloop) span normalisation.
  # Our app emits native gen_ai.* semconv attributes directly, so this
  # processor is not required for correct operation.

  filter/logs:
    error_mode: ignore
    logs:
      log_record:
        - 'severity_number < SEVERITY_NUMBER_INFO and attributes["event.name"] == nil'

  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    override: false

  resource/splunk:
    attributes:
      - key: deployment.environment
        value: "${OTEL_DEPLOYMENT_ENV}"
        action: upsert
      - key: deployment.environment.name
        value: "${OTEL_DEPLOYMENT_ENV}"
        action: upsert

connectors:
  span_metrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
      unit: ms
    dimensions:
      - name: gen_ai.operation.name
      - name: gen_ai.provider.name
      - name: gen_ai.request.model
      - name: deployment.environment
      - name: session.id
    metrics_flush_interval: 15s

exporters:
  debug:
    verbosity: detailed

  otlp_http/splunk:
    traces_endpoint: "https://ingest.${SPLUNK_REALM}.signalfx.com/v2/trace/otlp"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"

  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    realm: "${SPLUNK_REALM}"
    sync_host_metadata: true
    correlation:
    send_otlp_histograms: true

  splunk_hec/logs:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    index: "${SPLUNK_HEC_INDEX}"
    source: "otel-collector"
    sourcetype: "${SPLUNK_HEC_SOURCETYPE}"
    tls:
      insecure_skip_verify: ${SPLUNK_HEC_INSECURE_SKIP_VERIFY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource_detection, batch, resource/splunk]
      exporters: [debug, otlp_http/splunk, span_metrics]
    metrics:
      receivers: [otlp, docker_stats, host_metrics, span_metrics]
      processors: [resource_detection, batch, resource/splunk]
      exporters: [debug, signalfx]
    logs:
      receivers: [otlp]
      processors: [filter/logs, resource_detection, batch, resource/splunk]
      exporters: [debug, splunk_hec/logs]
