# OpenTelemetry Collector configuration
# Receives OTLP telemetry from the Node.js API and exports to:
#   1. debug (stdout) -- always on, for local troubleshooting
#   2. Splunk Observability Cloud -- when SPLUNK_ACCESS_TOKEN is set
#
# Exporters:
#   Traces  -> otlphttp/splunk       (OTLP/HTTP to Splunk APM)
#   Metrics -> signalfx              (native Splunk metrics format)
#   Logs    -> otlp_http/splunk_logs (OTLP/HTTP to Splunk Log Observer)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    timeout: 5s

  # Normalise OpenLLMetry (Traceloop) spans to official gen_ai.* semconv.
  # Built-in source -- no custom mappings needed.
  gen_ai_normalizer:
    sources:
      - name: openllmetry

  # Add resource attributes for Splunk correlation
  resource/splunk:
    attributes:
      - key: deployment.environment
        value: "${OTEL_DEPLOYMENT_ENV}"
        action: upsert

exporters:
  # Local debug output (always active)
  debug:
    verbosity: detailed

  # Traces -> Splunk APM via OTLP/HTTP
  # (sapm is deprecated; otlp_http is the recommended replacement)
  otlp_http/splunk:
    traces_endpoint: "https://ingest.${SPLUNK_REALM}.signalfx.com/v2/trace/otlp"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"

  # Metrics -> Splunk Infrastructure Monitoring via SignalFx exporter
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    realm: "${SPLUNK_REALM}"

  # Logs -> Splunk Log Observer via OTLP/HTTP
  # (splunk_hec was returning 404 -- Observability Cloud does not expose
  #  the /services/collector HEC path; use OTLP/HTTP instead)
  otlp_http/splunk_logs:
    logs_endpoint: "https://ingest.${SPLUNK_REALM}.signalfx.com/v2/log/otlp"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [gen_ai_normalizer, batch, resource/splunk]
      exporters: [debug, otlp_http/splunk]
    metrics:
      receivers: [otlp]
      processors: [batch, resource/splunk]
      exporters: [debug, signalfx]
    logs:
      receivers: [otlp]
      processors: [batch, resource/splunk]
      exporters: [debug, otlp_http/splunk_logs]
