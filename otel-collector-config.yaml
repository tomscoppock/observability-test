# OpenTelemetry Collector configuration -- SPLUNK ONLY (the baseline)
#
# Sibling files (select one via OTEL_COLLECTOR_CONFIG in .env):
#   otel-collector-config.yaml        Splunk only (this file, the default)
#   otel-collector-config.azure.yaml  Azure Monitor only
#   otel-collector-config.dual.yaml   both backends in parallel
#
# This file is the reference Splunk configuration and is deliberately
# kept static -- see docs/azure-monitor-setup.md. Changes that apply to
# both backends must be mirrored into the two sibling files by hand.
#
# Receives OTLP telemetry from the Node.js API and exports to:
#   1. debug (stdout) -- always on, for local troubleshooting
#   2. Splunk Observability Cloud -- when SPLUNK_ACCESS_TOKEN is set
#   3. Splunk Cloud Platform -- when SPLUNK_HEC_TOKEN is set (logs only)
#
# Exporters:
#   Traces  -> otlphttp/splunk (OTLP/HTTP to Splunk APM, Observability Cloud)
#   Metrics -> signalfx        (native Splunk metrics format, Observability Cloud)
#   Logs    -> splunk_hec/logs (HEC to Splunk Cloud Platform / Enterprise)
#
# Note: logs do NOT go to Observability Cloud. Splunk deprecated native
# Log Observer (direct OTLP/HEC ingest into Observability Cloud) in
# January 2024. The current product, Log Observer Connect, reads logs
# live from a separate Splunk Enterprise/Cloud Platform instance rather
# than storing them in Observability Cloud -- see docs/splunk-setup.md
# for the full architecture and linking steps.
#
# Connectors:
#   span_metrics -- generates duration + calls metrics from ALL spans
#                   (including INTERNAL/CLIENT), exported via signalfx
#
# Component names use the current spellings, not the older one-word
# aliases (hostmetrics, resourcedetection, spanmetrics, cumulativetodelta),
# which collector 0.160 logs as deprecated on startup. `otelcol validate`
# does NOT flag them, so they are invisible unless you read the boot log.
#
# VERIFIED SAFE: renaming the connector does NOT change the metric names it
# emits. The namespace is not derived from the component instance name --
# a connector named `span_metrics` still emits `traces.span.metrics.calls`
# and `traces.span.metrics.duration`, so no dashboard chart breaks.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Container resource metrics via the Docker daemon socket.
  # Requires /var/run/docker.sock mounted into the collector container.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    container_labels_to_metric_labels:
      com.docker.compose.service: compose.service
      com.docker.compose.project: compose.project

  # Host-level metrics (CPU, memory, disk, network).
  # Required for Splunk Infrastructure views and Related Content
  # correlation between APM traces and infrastructure data.
  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu: {}
      memory: {}
      filesystem: {}
      network: {}

processors:
  batch:
    send_batch_size: 512
    timeout: 5s

  # Normalise OpenLLMetry (Traceloop) spans to official gen_ai.* semconv.
  # Built-in source -- no custom mappings needed.
  gen_ai_normalizer:
    sources:
      - name: openllmetry

  # Drop DEBUG and TRACE log records before export to reduce noise and
  # Splunk ingest volume.  Only INFO (9), WARN (13), ERROR (17), and
  # FATAL (21) logs are forwarded.
  filter/logs:
    error_mode: ignore
    logs:
      log_record:
        # Drop below-INFO noise, but NEVER drop a GenAI event. Those carry
        # event.name and the reference implementation leaves their severity
        # UNSPECIFIED(0), so a bare severity floor silently deletes exactly
        # the records Splunk's AI screens are built from.
        - 'severity_number < SEVERITY_NUMBER_INFO and attributes["event.name"] == nil'

  # Detect host.name and os.type from the environment.
  # Required for Splunk Related Content (APM <-> Infrastructure correlation).
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    override: false

  # Add resource attributes for Splunk correlation.
  #
  # BOTH spellings are set deliberately. `deployment.environment` is the
  # older attribute and is what Splunk APM's environment picker has always
  # used. `deployment.environment.name` is the current semantic convention
  # name, and Splunk's own AI agent monitoring documentation asks for that
  # spelling when describing environment identity. Emitting only the old
  # one risks a newer surface not seeing an environment at all; emitting
  # only the new one would break the existing dashboards. They cost a few
  # bytes each, so send both until the vendor has finished migrating.
  resource/splunk:
    attributes:
      - key: deployment.environment
        value: "${OTEL_DEPLOYMENT_ENV}"
        action: upsert
      - key: deployment.environment.name
        value: "${OTEL_DEPLOYMENT_ENV}"
        action: upsert

# Connectors bridge pipelines: exporter in one, receiver in another.
connectors:
  # Generate RED (Request/Error/Duration) metrics from trace spans.
  # Produces two metrics:
  #   duration  -- explicit-bucket histogram of span durations (ms)
  #   calls     -- counter of span invocations
  # Dimensions: service.name, span.name, span.kind, status.code,
  #             plus any custom dimensions listed below.
  span_metrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
      unit: ms
    dimensions:
      - name: gen_ai.operation.name
      - name: gen_ai.provider.name
      - name: gen_ai.request.model
      - name: deployment.environment
      # session.id makes the Active Sessions chart possible WITHOUT the
      # manual Splunk step. Splunk has no public API for APM MetricSets
      # (UI only, Settings > APM & RUM MetricSets), so indexing a tag as a
      # Monitoring MetricSet dimension cannot be automated -- but a
      # span_metrics dimension arrives as a real metric dimension and needs
      # no indexing at all. Same trick task 033 used for custom span
      # latency.
      #
      # CARDINALITY WARNING, and read this before copying it anywhere near
      # production. Every dimension multiplies the metric time series
      # count. session.id is a high-cardinality identifier, so the cost is
      # roughly (distinct endpoints) x (active sessions).
      #
      # Two things keep it safe HERE, and both are deliberate:
      #   1. The app sets session.id on the SERVER span only, so child
      #      spans are unaffected. VERIFIED: a span without the attribute
      #      has the dimension OMITTED from its datapoint entirely, not set
      #      to empty, so it costs nothing.
      #   2. The app never invents a session id, so unheadered traffic
      #      (healthchecks, probes) adds no series at all.
      #
      # For this demo that is ~6 endpoints x ~3 sessions. For a real
      # service with 10k concurrent sessions it is 60k extra MTS and a
      # bill to match. If you need distinct-session counts at that scale,
      # ask a log-based backend, not a dimensional-metrics one.
      - name: session.id
    metrics_flush_interval: 15s

exporters:
  # Local debug output (always active)
  debug:
    verbosity: detailed

  # Traces -> Splunk APM via OTLP/HTTP
  # (sapm is deprecated; otlp_http is the recommended replacement)
  otlp_http/splunk:
    traces_endpoint: "https://ingest.${SPLUNK_REALM}.signalfx.com/v2/trace/otlp"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"

  # Metrics -> Splunk Infrastructure Monitoring via SignalFx exporter
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    realm: "${SPLUNK_REALM}"
    # Required to send histogram metrics (e.g. duration from span_metrics)
    send_otlp_histograms: true

  # Logs -> Splunk Cloud Platform / Enterprise via HTTP Event Collector (HEC)
  # Native Log Observer (direct OTLP into Observability Cloud) was
  # deprecated by Splunk in January 2024. Logs must live in a genuine
  # Splunk Enterprise/Cloud Platform instance for Log Observer Connect
  # to read them -- see docs/splunk-setup.md for the linking steps.
  splunk_hec/logs:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    index: "${SPLUNK_HEC_INDEX}"
    source: "otel-collector"
    sourcetype: "${SPLUNK_HEC_SOURCETYPE}"
    tls:
      # Only set SPLUNK_HEC_INSECURE_SKIP_VERIFY=true against a Splunk
      # instance still using its default self-signed SplunkServerDefaultCert
      # (e.g. an unprovisioned trial's HEC port) -- never against a
      # production Splunk deployment. Provision a real cert there instead.
      insecure_skip_verify: ${SPLUNK_HEC_INSECURE_SKIP_VERIFY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [gen_ai_normalizer, resource_detection, batch, resource/splunk]
      exporters: [debug, otlp_http/splunk, span_metrics]
    metrics:
      receivers: [otlp, docker_stats, host_metrics, span_metrics]
      processors: [resource_detection, batch, resource/splunk]
      exporters: [debug, signalfx]
    logs:
      receivers: [otlp]
      processors: [filter/logs, resource_detection, batch, resource/splunk]
      exporters: [debug, splunk_hec/logs]
