# Docker Compose stack for the Observability Test RAG Agent.
# All configuration values come from .env (see .env.example).

services:
  # ---------- Chat UI + reverse proxy ----------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Node.js RAG API ----------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_API_BASE_URL=${EMBEDDING_API_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-3072}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-2024-10-21}
      - SURREAL_URL=${SURREAL_URL:-http://surrealdb:8000}
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-observability}
      - SURREAL_DB=${SURREAL_DB:-rag}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-rag-api}
      # Set to debug/verbose to surface OTel SDK export diagnostics on
      # stdout (export failures are silent by default). Leave empty in
      # normal use -- debug is extremely noisy.
      - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=dev}
      # Splunk Observability requires delta temporality for histogram metrics;
      # without this the OTel SDK emits cumulative histograms which Splunk drops.
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=delta
      # Capture LLM prompt and response content as span attributes.
      # OFF BY DEFAULT and it must stay that way outside a test system:
      # prompts and responses routinely contain PII and proprietary data.
      #
      # Splunk's AI Agent Monitoring (APM > AI trace data, AI Interactions)
      # and its platform-side evaluations need this content to have anything
      # to show. SPAN_ONLY is the value Splunk's setup guide specifies, and
      # puts content on the span rather than emitting separate log events.
      # See docs/splunk-setup.md section 28 before enabling it anywhere real.
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-false}
      - MCP_PLAYWRIGHT_URL=${MCP_PLAYWRIGHT_URL:-}
      - MCP_PLAYWRIGHT_API_KEY=${MCP_PLAYWRIGHT_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      surrealdb:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./db:/app/db:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ---------- SurrealDB ----------
  # SurrealMX: in-memory engine with async AOL + periodic snapshots.
  # Data survives process restarts via the named volume.
  # Telemetry: pushes surrealdb.* metrics, traces, and logs to the
  # OTel Collector via OTLP gRPC (SURREAL_TELEMETRY_PROVIDER=otlp).
  surrealdb:
    image: surrealdb/surrealdb:latest
    # SurrealDB 3.x runs as non-root; the named volume is root-owned,
    # so we override to root for this dev stack.
    user: "0:0"
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} "mem://srdb?aol=async&sync=5s&snapshot=60s"
    working_dir: /data
    ports:
      - "8000:8000"
    environment:
      # Enable built-in OTel telemetry (metrics + traces + logs)
      - SURREAL_TELEMETRY_PROVIDER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=surrealdb
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
    volumes:
      - surreal-data:/data
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # ---------- OpenTelemetry Collector ----------
  # Exports traces and metrics to Splunk Observability Cloud when
  # SPLUNK_ACCESS_TOKEN and SPLUNK_REALM are set in .env. Exports logs
  # to Splunk Cloud Platform / Enterprise via HEC when SPLUNK_HEC_TOKEN
  # is set (Observability Cloud no longer accepts direct log ingest --
  # see docs/splunk-setup.md).
  #
  # The BACKEND is chosen by which config file is mounted, via
  # OTEL_COLLECTOR_CONFIG in .env:
  #   ./otel-collector-config.yaml        Splunk only (default)
  #   ./otel-collector-config.azure.yaml  Azure Monitor only
  #   ./otel-collector-config.dual.yaml   both in parallel
  # See docs/azure-monitor-setup.md.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    # Run as root so the docker_stats receiver can read /var/run/docker.sock.
    user: "0:0"
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - SPLUNK_ACCESS_TOKEN=${SPLUNK_ACCESS_TOKEN:-}
      - SPLUNK_REALM=${SPLUNK_REALM:-us1}
      # The splunk_hec exporter rejects an empty endpoint OR token at
      # config-validation time, which would stop the WHOLE collector
      # (traces and metrics included), so both default to inert
      # placeholders rather than "". Until these are set in .env, log
      # exports fail with connection-refused warnings while traces and
      # metrics keep working normally. To silence those warnings
      # entirely, remove splunk_hec/logs from the logs pipeline in
      # otel-collector-config.yaml.
      - SPLUNK_HEC_URL=${SPLUNK_HEC_URL:-https://localhost:8088/services/collector}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-hec-token-not-configured}
      - SPLUNK_HEC_INDEX=${SPLUNK_HEC_INDEX:-main}
      - SPLUNK_HEC_SOURCETYPE=${SPLUNK_HEC_SOURCETYPE:-otel}
      # Only set to true against a Splunk instance still using its default
      # self-signed cert (e.g. an unprovisioned trial) -- never in production.
      - SPLUNK_HEC_INSECURE_SKIP_VERIFY=${SPLUNK_HEC_INSECURE_SKIP_VERIFY:-false}
      # The azure_monitor exporter rejects an EMPTY connection string at
      # config-validation time, which would stop the WHOLE collector --
      # the same failure mode as the HEC placeholders above, so it gets
      # the same treatment: an inert placeholder default. Until this is
      # set in .env, Azure exports fail with warnings while everything
      # else keeps working.
      # This value embeds an ingestion key and IS a credential. Unlike
      # the Splunk token it CANNOT be rotated -- remediation for a leak
      # is a new App Insights resource and losing data continuity.
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-InstrumentationKey=00000000-0000-0000-0000-000000000000;IngestionEndpoint=https://localhost/}
      - OTEL_DEPLOYMENT_ENV=dev
    volumes:
      # Backend selector -- see the comment above this service.
      - ${OTEL_COLLECTOR_CONFIG:-./otel-collector-config.yaml}:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  surreal-data:

