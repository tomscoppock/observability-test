# Docker Compose stack for the Observability Test RAG Agent.
# All configuration values come from .env (see .env.example).

services:
  # ---------- Chat UI + reverse proxy ----------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Node.js RAG API ----------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - EMBEDDING_API_BASE_URL=${EMBEDDING_API_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-3072}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-2024-10-21}
      - SURREAL_URL=${SURREAL_URL:-http://surrealdb:8000}
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-observability}
      - SURREAL_DB=${SURREAL_DB:-rag}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-rag-api}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=dev}
      - MCP_PLAYWRIGHT_URL=${MCP_PLAYWRIGHT_URL:-}
      - MCP_PLAYWRIGHT_API_KEY=${MCP_PLAYWRIGHT_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      surrealdb:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./db:/app/db:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ---------- SurrealDB ----------
  # SurrealMX: in-memory engine with async AOL + periodic snapshots.
  # Data survives process restarts via the named volume.
  # Telemetry: pushes surrealdb.* metrics, traces, and logs to the
  # OTel Collector via OTLP gRPC (SURREAL_TELEMETRY_PROVIDER=otlp).
  surrealdb:
    image: surrealdb/surrealdb:latest
    # SurrealDB 3.x runs as non-root; the named volume is root-owned,
    # so we override to root for this dev stack.
    user: "0:0"
    command: start --user ${SURREAL_USER:-root} --pass ${SURREAL_PASS:-root} "mem://srdb?aol=async&sync=5s&snapshot=60s"
    working_dir: /data
    ports:
      - "8000:8000"
    environment:
      # Enable built-in OTel telemetry (metrics + traces + logs)
      - SURREAL_TELEMETRY_PROVIDER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=surrealdb
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev
    volumes:
      - surreal-data:/data
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # ---------- OpenTelemetry Collector ----------
  # Exports traces, metrics, and logs to Splunk Observability Cloud
  # when SPLUNK_ACCESS_TOKEN and SPLUNK_REALM are set in .env.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    # Run as root so the docker_stats receiver can read /var/run/docker.sock.
    user: "0:0"
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - SPLUNK_ACCESS_TOKEN=${SPLUNK_ACCESS_TOKEN:-}
      - SPLUNK_REALM=${SPLUNK_REALM:-us1}
      - OTEL_DEPLOYMENT_ENV=dev
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  surreal-data:

