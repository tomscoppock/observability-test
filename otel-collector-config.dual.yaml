# OpenTelemetry Collector configuration -- Splunk AND Azure Monitor in parallel
#
# Sibling files (select one via OTEL_COLLECTOR_CONFIG in .env):
#   otel-collector-config.yaml        Splunk only (the baseline)
#   otel-collector-config.azure.yaml  Azure Monitor only
#   otel-collector-config.dual.yaml   both backends in parallel (this file)
#
# Collector pipelines fan out to EVERY exporter listed, so both backends
# receive byte-identical telemetry from one traffic run. That is what
# makes the comparison controlled: same spans, same metrics, two
# destinations, no second instrumentation to account for. Use this
# config for any side-by-side measurement.
#
#   Traces  -> otlp_http/splunk  + azure_monitor  (+ span_metrics connector)
#   Metrics -> signalfx          | azure_monitor  (SPLIT, see below)
#   Logs    -> splunk_hec/logs   + azure_monitor
#
# Metrics is the one signal that CANNOT be a single fan-out pipeline,
# because the two backends need different inputs and different
# processing:
#
#   metrics/splunk  otlp + docker_stats + host_metrics + span_metrics
#                   -> signalfx
#   metrics/azure   otlp + docker_stats
#                   -> cumulative_to_delta -> transform -> azure_monitor
#
# Why they differ -- see docs/splunk-vs-azure-monitor.md for the full
# reasoning:
#
#   span_metrics   Splunk NEEDS it (its MetricSets cover only
#                  SERVER/CONSUMER spans, so LLM/DB/MCP spans would
#                  produce no metrics). Azure does NOT: every CLIENT and
#                  INTERNAL span is a "dependencies" row with its own
#                  duration, so KQL percentiles work off the raw table.
#                  Sending it to Azure would give strictly less, because
#                  the exporter flattens histograms and yields no
#                  percentiles.
#
#   host_metrics   Splunk-only. Nothing charts it on either side; its
#                  purpose is APM-to-Infrastructure Related Content,
#                  which App Insights has no counterpart for. Its cpu
#                  and filesystem scrapers emit per-core and per-mount
#                  data points that would each become a billable
#                  customMetrics row.
#
#   cumulative_to_delta  Azure-only. customMetrics has no counter
#                  semantics, so cumulative counters chart as ramps. The
#                  signalfx exporter understands counters and Splunk's
#                  UI rates them, so applying this on the Splunk path
#                  would break it.
#
# Receiver INSTANCES are shared and fanned out across pipelines of the
# same type, so docker_stats appearing in both metrics pipelines scrapes
# the Docker socket once, not twice.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s
    container_labels_to_metric_labels:
      com.docker.compose.service: compose.service
      com.docker.compose.project: compose.project

  # Splunk path only -- required for Splunk Infrastructure views and
  # Related Content correlation between APM traces and infrastructure.
  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu: {}
      memory: {}
      filesystem: {}
      network: {}

processors:
  batch:
    send_batch_size: 512
    timeout: 5s

  gen_ai_normalizer:
    sources:
      - name: openllmetry

  filter/logs:
    error_mode: ignore
    logs:
      log_record:
        # Drop below-INFO noise, but NEVER drop a GenAI event. Those carry
        # event.name and the reference implementation leaves their severity
        # UNSPECIFIED(0), so a bare severity floor silently deletes exactly
        # the records Splunk's AI screens are built from.
        - 'severity_number < SEVERITY_NUMBER_INFO and attributes["event.name"] == nil'

  # Current component name. The baseline Splunk config still uses the
  # older one-word spelling, which collector 0.160 logs as a deprecated
  # alias; that file is left alone deliberately as the static Splunk
  # reference. Same applies to cumulative_to_delta below.
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    override: false

  # Named resource/splunk in the baseline config. Kept identical in
  # behaviour, renamed here because in dual mode it stamps telemetry
  # bound for both backends.
  resource/deployment_env:
    attributes:
      - key: deployment.environment
        value: "${OTEL_DEPLOYMENT_ENV}"
        action: upsert
      # Current semantic convention spelling. Splunk's AI agent monitoring
      # docs ask for this one; the APM environment picker has always used
      # the older key above. Send both until the vendor finishes migrating.
      - key: deployment.environment.name
        value: "${OTEL_DEPLOYMENT_ENV}"
        action: upsert

  # Azure metrics path only. See the header, and the long-form comment
  # in otel-collector-config.azure.yaml.
  cumulative_to_delta:
    include:
      match_type: strict
      metrics:
        - container.cpu.usage.total
        - container.network.io.usage.rx_bytes
        - container.network.io.usage.tx_bytes
        - surrealdb.transaction
        - surrealdb.http.request

  # Azure metrics path only. Copies container identity from resource
  # attributes onto data points so it reaches customDimensions.
  # Paths carry the explicit "datapoint." prefix; the bare
  # attributes[...] form works but the collector rewrites it and warns.
  transform/azure_dims:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["container.name"], resource.attributes["container.name"]) where resource.attributes["container.name"] != nil
          - set(datapoint.attributes["compose.service"], resource.attributes["compose.service"]) where resource.attributes["compose.service"] != nil

connectors:
  # Splunk path only. Generates RED metrics from trace spans:
  #   duration  -- explicit-bucket histogram of span durations (ms)
  #   calls     -- counter of span invocations
  # Feeds metrics/splunk, NOT metrics/azure.
  span_metrics:
    histogram:
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
      unit: ms
    dimensions:
      - name: gen_ai.operation.name
      - name: gen_ai.provider.name
      - name: gen_ai.request.model
      - name: deployment.environment
      # session.id makes the Active Sessions chart possible WITHOUT the
      # manual Splunk step. Splunk has no public API for APM MetricSets
      # (UI only, Settings > APM & RUM MetricSets), so indexing a tag as a
      # Monitoring MetricSet dimension cannot be automated -- but a
      # span_metrics dimension arrives as a real metric dimension and needs
      # no indexing at all. Same trick task 033 used for custom span
      # latency.
      #
      # CARDINALITY WARNING, and read this before copying it anywhere near
      # production. Every dimension multiplies the metric time series
      # count. session.id is a high-cardinality identifier, so the cost is
      # roughly (distinct endpoints) x (active sessions).
      #
      # Two things keep it safe HERE, and both are deliberate:
      #   1. The app sets session.id on the SERVER span only, so child
      #      spans are unaffected. VERIFIED: a span without the attribute
      #      has the dimension OMITTED from its datapoint entirely, not set
      #      to empty, so it costs nothing.
      #   2. The app never invents a session id, so unheadered traffic
      #      (healthchecks, probes) adds no series at all.
      #
      # For this demo that is ~6 endpoints x ~3 sessions. For a real
      # service with 10k concurrent sessions it is 60k extra MTS and a
      # bill to match. If you need distinct-session counts at that scale,
      # ask a log-based backend, not a dimensional-metrics one.
      - name: session.id
    metrics_flush_interval: 15s

exporters:
  debug:
    verbosity: detailed

  # ---------- Splunk ----------
  # (sapm is deprecated; otlp_http is the recommended replacement.
  #  Note: "otlp_http" is the canonical component name -- "otlphttp"
  #  is the deprecated alias, not the other way round.)
  otlp_http/splunk:
    traces_endpoint: "https://ingest.${SPLUNK_REALM}.signalfx.com/v2/trace/otlp"
    headers:
      X-SF-Token: "${SPLUNK_ACCESS_TOKEN}"

  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    realm: "${SPLUNK_REALM}"
    sync_host_metadata: true
    correlation:
    send_otlp_histograms: true

  splunk_hec/logs:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    index: "${SPLUNK_HEC_INDEX}"
    source: "otel-collector"
    sourcetype: "${SPLUNK_HEC_SOURCETYPE}"
    tls:
      insecure_skip_verify: ${SPLUNK_HEC_INSECURE_SKIP_VERIFY}

  # ---------- Azure Monitor ----------
  # Note the underscore: "azure_monitor", NOT "azuremonitor".
  # An EMPTY connection string fails validation at config-decode time
  # and stops the WHOLE collector -- docker-compose.yml therefore
  # supplies an inert placeholder default, exactly as it does for the
  # HEC token.
  azure_monitor:
    connection_string: "${APPLICATIONINSIGHTS_CONNECTION_STRING}"
    spaneventsenabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [gen_ai_normalizer, resource_detection, batch, resource/deployment_env]
      exporters: [debug, otlp_http/splunk, azure_monitor, span_metrics]

    metrics/splunk:
      receivers: [otlp, docker_stats, host_metrics, span_metrics]
      processors: [resource_detection, batch, resource/deployment_env]
      exporters: [debug, signalfx]

    metrics/azure:
      receivers: [otlp, docker_stats]
      processors: [resource_detection, cumulative_to_delta, transform/azure_dims, batch, resource/deployment_env]
      exporters: [azure_monitor]

    logs:
      receivers: [otlp]
      processors: [filter/logs, resource_detection, batch, resource/deployment_env]
      exporters: [debug, splunk_hec/logs, azure_monitor]
