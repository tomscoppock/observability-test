server {
    listen 80;
    server_name localhost;

    # Allow file uploads up to 10 MB
    client_max_body_size 10m;

    # Serve static chat UI files
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API requests to the Node.js service
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for upload/embedding/LLM calls
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Also proxy the health endpoint for convenience
    location /health {
        proxy_pass http://api:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static files -- cache for 1 hour (dev convenience)
    location ~* \.(css|js|png|ico|svg)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
