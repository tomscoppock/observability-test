<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>HR Policy Chat</h1>
      <p class="subtitle">Observability Test Project</p>
      <button id="test-error-btn" class="test-error-btn" title="Generate a test error for OTel/Splunk verification">Test Error</button>
    </header>

    <div id="messages" aria-live="polite" aria-label="Chat messages">
      <div class="message system">
        Welcome! Drag and drop HR policy files (.txt, .md) into this area to upload them, then ask questions about company policies.
      </div>
    </div>

    <div id="drop-zone" class="drop-zone" aria-label="File drop zone">
      <p>Drag files here to upload, or <label for="file-input" class="file-label">browse</label></p>
      <input type="file" id="file-input" multiple accept=".txt,.md" hidden>
      <p class="drop-hint">Accepted: .txt, .md (max 5 MB each)</p>
    </div>

    <form id="scrape-form" autocomplete="off">
      <input
        type="url"
        id="scrape-url"
        placeholder="Paste a URL to scrape into the knowledge base..."
        aria-label="URL to scrape"
      >
      <button type="submit" id="scrape-btn">Scrape</button>
    </form>

    <form id="chat-form" autocomplete="off">
      <input
        type="text"
        id="message-input"
        placeholder="Ask about company policies..."
        aria-label="Message input"
        required
      >
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
